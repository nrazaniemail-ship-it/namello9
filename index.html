<script>
  // window.storage shim backed by localStorage — matches the same API the app already uses,
  // so no app code needs to change between the in-chat preview and this standalone build.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem('ns_' + key);
      if (raw === null) throw new Error('not found');
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem('ns_' + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem('ns_' + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('ns_' + (prefix || ''))) keys.push(k.slice(3));
      }
      return { keys, shared: false };
    },
  };
</script>
